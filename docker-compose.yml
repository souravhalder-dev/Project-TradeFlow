version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradeflow
    ports:
      - '5432:5432'
    volumes:
      - tradeflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tradeflow_pgdata:
    driver: local
