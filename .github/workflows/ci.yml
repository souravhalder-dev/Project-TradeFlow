name: TradeFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tradeflow?schema=public"
        run: |
          npx prisma db push
          npm run prisma:seed

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Next.js Application
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tradeflow?schema=public"
          AUTH_DEV_MODE: "true"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
